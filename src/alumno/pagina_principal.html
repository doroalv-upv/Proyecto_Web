<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pagina_principal.css">
    <title>DOA Home</title>
    <script src="../js/popup.js" defer></script>
</head>
<body>
<!--Encabezado de la página-->
    <header>
        <div>
            <!--Imagenes de LOGO , notificacion y perfil-->
            <a href="#"> <img src="../imagenes/logo_DOA.svg" alt="Logo de DOA" id="logo_DOA"> </a>

            <!--Popups de notificaciones y perfil-->
            <button class="btn-icono opener-dialog">  <img src="../imagenes/icono_notificacion.svg" alt="icono_notificaciones" id="icono_notificaciones">  </button>
                <dialog class="popup">
                    <!--Aqui va el contenido de las notificaciones-->

                </dialog>
            <button class="btn-icono opener-dialog" >  <img src="../imagenes/icono_perfil.svg" alt="icono_perfil" id="icono_perfil">  </button>
                <dialog class="popup">
                    <!--Aqui va el contenido del perfil-->


                </dialog>

            <!--Migas de pan-->
            <h4>Pagina principal</h4>
        </div>
    </header>
    <!--Fin del encabezado-->

    <!--Menu de hamburguesa-->
    <aside>
        <button class="btn opener-dialog">  <img src="../imagenes/icono_hamburguesa.svg" alt="logo-hamburguesa" id="icono-hamburguesa">  </button>

        <!--Contenidos hamburguesa-->
        <dialog class="popup" id="popup_hamburguesa" open>
            <!--Despegable de mis asignaturas-->
            <details>
                <summary>Mis asignaturas</summary>

                <button>Programacion</button>
                <button>Redes</button>
                <button>Proyecto Web</button>

            </details>
            <!--Boton de anuncios generales-->
            <button>Anuncios</button>
        </dialog>
    </aside>
</body>
</html>
