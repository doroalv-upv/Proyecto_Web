<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pagina_principal.css">
    <title>DOA Home</title>
    <script src="../js/popup.js" defer></script>

</head>
<body>
<!--Encabezado de la página-->
    <header>
            <!--Imagenes de LOGO , notificacion y perfil-->
            <a href="#"> <img src="../imagenes/logo_DOA.svg" alt="Logo de DOA" id="logo_DOA"> </a>

            <!--Popups de notificaciones y perfil-->
            <button class="btn-icono opener-dialog">  <img src="../imagenes/icono_notificacion.svg" alt="icono_notificaciones" id="icono_notificaciones">  </button>
                <dialog class="popup" id="popup_notificaciones">
                    <!--Aqui va el contenido de las notificaciones-->

                </dialog>
            <button class="btn-icono opener-dialog" >  <img src="../imagenes/icono_perfil.svg" alt="icono_perfil" id="icono_perfil">  </button>
                <dialog class="popup" id="popup_perfil">
                    <!--Aqui va el contenido del perfil-->


                </dialog>

            <!--Migas de pan-->
            <h4>Pagina principal</h4>
    </header>
    <!--Fin del encabezado-->

    <!--Menu de hamburguesa-->
    <aside class="btn ">  <img src="../imagenes/icono_hamburguesa.svg" alt="logo-hamburguesa" id="icono-hamburguesa" class="opener-dialog">

        <!--Contenidos hamburguesa-->

        <dialog class="popup" id="popup_hamburguesa" open>
            <!--Despegable de mis asignaturas-->
            <div>
                <details>
                    <summary>Mis asignaturas</summary>

                    <!--Aqui va los cursos, y el popup donde aparecen las asignaturas-->
                    <button class="opener-dialog"> 1º Curso</button>
                    <dialog class="popup popup-cerrar" >
                        <!--Asignaturas-->
                        <a href="#"> <button>  Redes  </button>   </a>
                        <a href="#"> <button>  Programacion  </button>   </a>
                        <a href="#"> <button>  Proyecto Web  </button>   </a>
                        

                    </dialog>

                    <button class="opener-dialog"> 2º Curso</button>
                    <dialog class="popup popup-cerrar" >

                        <a href="#"> <button>  Programacion  </button>   </a> 
                        <a href="#"> <button>  Programacion  </button>   </a>
                        <a href="#"> <button>  Proyecto Web  </button>   </a>
                    </dialog>

                </details>
                <!--Boton de anuncios generales-->
                <a href="#"><button id="boton-anuncios" >  Anuncios </button> </a>
            </div>
        </dialog>
    </aside>
</body>
</html>
