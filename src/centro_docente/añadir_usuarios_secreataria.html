
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir nuevo usuario</title>
  <link rel="stylesheet" href="../css/añadir_usuario.css">
</head>

<body>

  <!-- Campos de texto del usuario -->
  <main class="contenido-sin-barra">

    <h1 class="titulo-formulario">Añadir nuevo usuario</h1>

    <form class="formulario-alta">


    <label>Nombre
      <input type="text" id="nombre">
    </label>

    <label>Primer apellido
      <input type="text" id="apellido1">
    </label>

    <label>Segundo apellido
      <input type="text" id="apellido2">
    </label>

    <label>Correo electrónico
      <input type="email" id="email">
    </label>

    <label>Nombre de usuario
      <input type="text" id="usuario">
    </label>

    <label>Contraseña
      <input type="password" id="password">
    </label>

    <label>Tipo de usuario
      <select id="rol">
        <option>Alumno</option>
        <option>Docente</option>
        <option>Secretaría</option>
      </select>
    </label>

        <div class="acciones">
          <a href="crear_usuario.html" class="btn">
            Crear usuario
          </a>
        </div>
    </form>
  </main>
    <script src="../js/gestion_usuarios.js"></script>
</body>
</html>
