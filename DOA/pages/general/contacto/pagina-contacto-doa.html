<!DOCTYPE html>
<html lang="es">
<head>
    <!-- METADATOS DE LA PÁGINA DE CONTACTO / SOPORTE DE DOA -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOA | Contacto y soporte</title>
    <link rel="stylesheet" href="../../../assets/css/general/contacto/pagina-contacto-doa.css">
</head>
<body>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA DE CONTACTO / SOPORTE DE DOA -->
    <main class="pagina-contacto-soporte-doa">

        <!-- CABECERA DE LA PÁGINA DE CONTACTO / SOPORTE DE DOA -->
        <header class="cabecera-contacto-soporte-doa">

            <!-- LOGO DE DOA -->
            <div class="logo-doa-contenedor">
                    <img src="../../../assets/imagenes/Logo_DOA.svg" alt="Logo DOA" class="logo-doa">
                </div>

            <!-- ENLACE DE AYUDA -->
            <div class="enlace-ayuda-doa">
                <a href="#">Ayuda</a>
            </div>

        </header>

        <!-- BLOQUE PRINCIPAL DE PRESENTACIÓN -->
        <section class="bloque-presentacion-contacto-soporte-doa">

            <!-- TÍTULO PRINCIPAL -->
            <div class="texto-presentacion-contacto-soporte-doa">
                <h1>Contacto / Soporte DOA</h1>
                <p>Estamos aquí para ayudarte</p>
            </div>

        </section>

        <!-- CONTENIDO CENTRAL DE LA PÁGINA -->
        <section class="contenido-central-contacto-soporte-doa">

            <!-- FORMULARIO DE CONTACTO / SOPORTE -->
            <section class="bloque-formulario-contacto-soporte-doa">

                <!-- TÍTULO DEL FORMULARIO -->
                <div class="titulo-formulario-contacto-soporte-doa">
                    <h2>Envíanos tu consulta</h2>
                </div>

                <!-- FORMULARIO -->
                <form action="#" method="post" class="formulario-contacto-soporte-doa">

                    <!-- CAMPO NOMBRE -->
                    <div class="grupo-campo-formulario">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                    </div>

                    <!-- CAMPO EMAIL -->
                    <div class="grupo-campo-formulario">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu email" required>
                    </div>

                    <!-- CAMPO TIPO DE CONSULTA -->
                    <div class="grupo-campo-formulario">
                        <label for="tipo-consulta">Tipo de consulta</label>
                        <select id="tipo-consulta" name="tipo-consulta" required>
                            <option value="">Selecciona una opción</option>
                            <option value="soporte-tecnico">Soporte técnico</option>
                            <option value="problema-acceso">Problema de acceso</option>
                            <option value="secretaria">Secretaría / administración</option>
                            <option value="profesorado">Profesorado</option>
                            <option value="alumnado">Alumnado</option>
                            <option value="otra">Otra consulta</option>
                        </select>
                    </div>

                    <!-- CAMPO MENSAJE -->
                    <div class="grupo-campo-formulario">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" placeholder="Cuéntanos cómo podemos ayudarte..." required></textarea>
                    </div>

                    <!-- BOTÓN ENVIAR -->
                    <div class="grupo-boton-formulario">
                        <button type="submit">Enviar consulta</button>
                    </div>

                </form>

            </section>

            <!-- INFORMACIÓN DE CONTACTO -->
            <aside class="bloque-informacion-contacto-doa">

                <!-- TÍTULO DE INFORMACIÓN DE CONTACTO -->
                <div class="titulo-informacion-contacto-doa">
                    <h2>Información de contacto</h2>
                </div>

                <!-- CORREO DE SOPORTE -->
                <article class="item-informacion-contacto">
                    <h3>Correo de soporte</h3>
                    <p>soporte@doa.app</p>
                </article>

                <!-- TELÉFONO -->
                <article class="item-informacion-contacto">
                    <h3>Teléfono</h3>
                    <p>+34 900 123 456</p>
                </article>

                <!-- HORARIO -->
                <article class="item-informacion-contacto">
                    <h3>Horario de atención</h3>
                    <p>Lunes a Viernes</p>
                    <p>09:00 - 14:00</p>
                    <p>16:00 - 18:00</p>
                </article>

            </aside>

        </section>

        <!-- BLOQUE DE ENLACE A GTI -->
        <section class="bloque-enlace-gti">

            <!-- LOGO DE GTI -->
            <div class="logo-gti-contenedor">
                <img src="../../../assets/imagenes/Logo_GTI.svg" alt="Logo GTI" class="logo-gti">
            </div>

            <!-- TEXTO DEL ENLACE A GTI -->
            <div class="texto-enlace-gti">
                <h2>Visitar GTI</h2>
                <p>Ir a la web de GTI (enlace externo)</p>
            </div>

            <!-- BOTÓN O ENLACE A GTI -->
            <div class="boton-enlace-gti">
                <a href="../../GTI/landing/LandingPageGTI.html">Ir a GTI</a>
            </div>

        </section>

    </main>

</body>
</html>
