<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - GTI</title>
    <link rel="stylesheet" href="../../../assets/css/GTI/Contacto/contacto.css">

    <!-- =================== AQUÍ EMPIEZA SCRIPT DE PROTECCIÓN DE SESIÓN =================== -->
    <!-- Si no hay sesión iniciada, redirige al login automáticamente -->
    <!-- =================== AQUÍ ACABA SCRIPT DE PROTECCIÓN DE SESIÓN =================== -->
</head>
<body>

    <!-- =================== AQUÍ EMPIEZA SECCIÓN HEADER (LOGO + MENÚ NAVEGACIÓN) =================== -->
    <header class="header">

        <!-- Logo GTI a la izquierda -->
        <a href="../landing/LandingPageGTI.html">
            <img src="../../../assets/imagenes/Logo_GTI.svg" alt="Logo GTI - Grado en Tecnologías Interactivas" class="logo-gti">
        </a>
        <!-- Título CONTACTO en el centro/superior -->
        <h1 class="titulo-contacto">CONTACTO</h1>

        <!-- Menú de navegación granate redondeado a la derecha -->
        <nav class="menu-nav">
            <a href="../landing/LandingPageGTI.html" class="menu-link">Inicio</a>
            <a href="../Contacto/contacto.html" class="menu-link">Contacto</a>
            <a href="#carrito" class="menu-carrito">
                <img src="../../../assets/iconos/Icono_Carrito_Blanco.svg" alt="Carrito de compra">
            </a>
            <!-- <a href="#" id="btn-cerrar-sesion" class="menu-link">Cerrar sesión</a> -->
        </nav>

    </header>
    <!-- =================== AQUÍ ACABA SECCIÓN HEADER =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN CONTACTO =================== -->
    <main class="contenedor-contacto">

        <!-- Caja blanca con borde granate (basada en el SVG Rectangle_342) -->
        <div class="caja-contacto">

            <!-- Número de teléfono (clic para llamar) -->
            <p class="dato-contacto">
                <strong>Número telefónico:</strong>
                <a href="tel:96020304">96020304</a>
            </p>

            <!-- Correo electrónico (clic para enviar email) -->
            <p class="dato-contacto">
                <strong>Correo electrónico:</strong>
                <a href="mailto:gti@gmail.com">gti@gmail.com</a>
            </p>

            <!-- Horario de atención (texto informativo) -->
            <p class="dato-contacto">
                <strong>Horario Atención al cliente:</strong>
                Lunes a viernes de 9:00 a 19:00.
            </p>

        </div>

    </main>
    <!-- =================== AQUÍ ACABA SECCIÓN CONTACTO =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN FOOTER =================== -->
    <footer class="footer">
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Dispositivos.svg" alt="Icono dispositivos">
            <p>Accede desde PC y móvil</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Escudo.svg" alt="Icono escudo de seguridad">
            <p>Mejora el rendimiento</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Comunidad.svg" alt="Icono comunidad">
            <p>Conecta con la comunidad</p>
        </div>
    </footer>
    <!-- =================== AQUÍ ACABA SECCIÓN FOOTER =================== -->

    <!-- Script para cerrar sesión -->

</body>
</html>
