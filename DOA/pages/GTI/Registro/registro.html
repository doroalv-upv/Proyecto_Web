<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GTI</title>
    <link rel="stylesheet" href="../../../assets/css/GTI/Registrado/registro.css">
</head>
<body>

    <!-- =================== AQUÍ EMPIEZA SECCIÓN HEADER (LOGO GTI) =================== -->
    <header class="header">
        <a href="../landing/LandingPageGTI.html">
            <img src="../../../assets/imagenes/Logo_GTI.svg" alt="Logo GTI - Grado en Tecnologías Interactivas" class="logo-gti">
        </a>
    </header>
    <!-- =================== AQUÍ ACABA SECCIÓN HEADER =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN FORMULARIO DE REGISTRO =================== -->
    <main class="contenedor-registro">

        <!-- Título de la sección -->
        <h1 class="titulo-registro">REGISTRO</h1>

        <!-- Formulario de registro -->
        <form id="form-registro" class="form-registro" action="../login/login_GTI.html" method="POST">

            <!-- Campo Nombre -->
            <input
                type="text"
                name="nombre"
                id="nombre"
                class="input-registro"
                placeholder="Nombre"
                required>

            <!-- Campo Apellidos -->
            <input
                type="text"
                name="apellidos"
                id="apellidos"
                class="input-registro"
                placeholder="Apellidos"
                required>

            <!-- Campo Correo electrónico -->
            <input
                type="email"
                name="correo"
                id="correo"
                class="input-registro"
                placeholder="Correo electrónico"
                required>

            <!-- Campo Número telefónico -->
            <input
                type="tel"
                name="telefono"
                id="telefono"
                class="input-registro"
                placeholder="Número telefónico"
                required>

            <!-- Campo Contraseña -->
            <input
                type="password"
                name="password"
                id="password"
                class="input-registro"
                placeholder="Contraseña"
                required>

            <!-- Botón registrarse -->
            <button type="submit" class="btn-registrarse">Registrarse</button>

            <!-- Mensaje de error o validación (vacío por defecto) -->
            <p id="mensaje-error" class="mensaje-error"></p>

        </form>

    </main>
    <!-- =================== AQUÍ ACABA SECCIÓN FORMULARIO DE REGISTRO =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN FOOTER =================== -->
    <footer class="footer">
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Dispositivos.svg" alt="Icono dispositivos">
            <p>Accede desde PC y móvil</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Escudo.svg" alt="Icono escudo de seguridad">
            <p>Mejora el rendimiento</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Comunidad.svg" alt="Icono comunidad">
            <p>Conecta con la comunidad</p>
        </div>
    </footer>
    <!-- =================== AQUÍ ACABA SECCIÓN FOOTER =================== -->

    <!-- Script de validación del formulario -->

</body>
</html>
