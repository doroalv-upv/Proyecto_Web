<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - GTI</title>
    <link rel="stylesheet" href="../../../assets/css/GTI/productos_logeado/productos_logeado.css">

    <!-- =================== AQUÍ EMPIEZA SCRIPT DE PROTECCIÓN DE SESIÓN =================== -->
    <!-- Este script se ejecuta antes de mostrar la página: si no hay sesión iniciada,
         redirige al login automáticamente -->

    <!-- =================== AQUÍ ACABA SCRIPT DE PROTECCIÓN DE SESIÓN =================== -->
</head>
<body>

    <!-- =================== AQUÍ EMPIEZA SECCIÓN HEADER (LOGO + MENÚ NAVEGACIÓN) =================== -->
    <header class="header">

        <!-- Logo GTI a la izquierda -->
        <a href="../landing/LandingPageGTI.html">
            <img src="../../../assets/imagenes/Logo_GTI.svg" alt="Logo GTI - Grado en Tecnologías Interactivas" class="logo-gti">
        </a>

        <!-- Menú de navegación a la derecha (caja granate redondeada) -->
        <nav class="menu-nav">
            <a href="../home/home.html" class="menu-link">Inicio</a>
            <a href="../Contacto_logeado/contacto_logeado.html" class="menu-link">Contacto</a>
            <a href="#carrito" class="menu-carrito">
                <img src="../../../assets/iconos/Icono_Carrito_Blanco.svg" alt="Carrito de compra">
            </a>
            <a href="../login/login_GTI.html" id="btn-cerrar-sesion" class="menu-link">Cerrar sesión</a>
        </nav>

    </header>
    <!-- =================== AQUÍ ACABA SECCIÓN HEADER =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN TÍTULO =================== -->
    <section class="titulo-seccion">
        <h1>PRODUCTOS</h1>
    </section>
    <!-- =================== AQUÍ ACABA SECCIÓN TÍTULO =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN LISTA DE PRODUCTOS =================== -->
    <section class="lista-productos">

        <!-- Producto DOA -->
        <a href="../../../pages/GTI/Info_DOA_logeado/Info_doa_logeado.html" class="producto">
            <img src="../../../assets/imagenes/Logo_DOA_Transparente.svg" alt="Logo DOA" class="producto-logo">
            <p class="producto-descripcion">Solicita tu período de prueba</p>
        </a>

        <!-- Producto KIBIK -->
        <a href="#kibik" class="producto">
            <img src="../../../assets/imagenes/Logo_KIBIK.svg" alt="Logo KIBIK" class="producto-logo">
            <p class="producto-descripcion">Tu proyecto IOT</p>
        </a>

    </section>
    <!-- =================== AQUÍ ACABA SECCIÓN LISTA DE PRODUCTOS =================== -->


    <!-- =================== AQUÍ EMPIEZA SECCIÓN FOOTER (BARRA INFERIOR CON 3 ICONOS) =================== -->
    <footer class="footer">
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Dispositivos.svg" alt="Icono dispositivos">
            <p>Accede desde PC y móvil</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Escudo.svg" alt="Icono escudo de seguridad">
            <p>Mejora el rendimiento</p>
        </div>
        <div class="footer-item">
            <img src="../../../assets/iconos/Icono_Comunidad.svg" alt="Icono comunidad">
            <p>Conecta con la comunidad</p>
        </div>
    </footer>
    <!-- =================== AQUÍ ACABA SECCIÓN FOOTER =================== -->
